<title>Tribbu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: una sola app de teléfono centrada; en móvil ocupa el ancho. Lenguaje visual de crayón y papel de construcción. */
:root{
  --bg:#E9EEF4; --paper:#FFFFFF; --paper-2:#F4F6FA; --ink:#1E2A4F; --ink-soft:#56607E; --line:#D7DDEA;
  --sun:#F2B632; --sun-ink:#3A2A00; --leaf:#2F8F5B; --leaf-bg:#E3F3EA; --berry:#C2335A; --berry-bg:#FBE6EC;
  --sky:#3E6FD8; --sky-bg:#E5ECFB; --amber-bg:#FDF1D3; --night:#141B33;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1426; --paper:#18213A; --paper-2:#1F2A47; --ink:#EEF1FA; --ink-soft:#A7B0CC; --line:#2C3858;
  --sun:#F5C04A; --sun-ink:#2A1E00; --leaf:#5CC48A; --leaf-bg:#173528; --berry:#F0729A; --berry-bg:#3D1A28;
  --sky:#7FA3F2; --sky-bg:#1D2A4F; --amber-bg:#3A2F12; --night:#080C1A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1426; --paper:#18213A; --paper-2:#1F2A47; --ink:#EEF1FA; --ink-soft:#A7B0CC; --line:#2C3858;
  --sun:#F5C04A; --sun-ink:#2A1E00; --leaf:#5CC48A; --leaf-bg:#173528; --berry:#F0729A; --berry-bg:#3D1A28;
  --sky:#7FA3F2; --sky-bg:#1D2A4F; --amber-bg:#3A2F12; --night:#080C1A; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:16px;box-sizing:border-box}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}
.app{max-width:420px;margin:0 auto;height:100%;max-height:880px;display:flex;flex-direction:column;background:var(--paper-2);border:1px solid var(--line);border-radius:32px;overflow:hidden;position:relative}
.top{padding:12px 16px 10px;background:var(--paper);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.01em;display:flex;align-items:center;gap:4px}
.brand i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--sun);box-shadow:10px 0 0 var(--sky),5px -8px 0 var(--berry);margin:6px 14px 0 2px}
.demo{font-family:var(--body);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);border:1px dashed var(--line);border-radius:99px;padding:1px 7px;margin-left:6px;font-weight:700}
.kids{display:flex;gap:8px;flex-wrap:wrap}
.kid{display:flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--paper);border-radius:99px;padding:4px 12px 4px 4px;font-weight:700}
.kid .av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;color:var(--sun-ink);background:var(--sun)}
.kid.m .av{background:var(--sky);color:var(--paper)}
.kid[aria-pressed="true"]{border-color:var(--ink)}
.kid small{font-weight:400;color:var(--ink-soft)}
.cg-banner{background:var(--sky-bg);color:var(--ink);border-radius:12px;padding:8px 10px;font-size:12.5px;display:flex;gap:8px;align-items:flex-start}
.cg-banner svg{flex:none;margin-top:1px}
main{flex:1;overflow-y:auto;padding:16px 16px 90px;display:flex;flex-direction:column;gap:16px}
.view{display:flex;flex-direction:column;gap:16px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec-h h2{font-size:21px}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-soft);font-weight:700}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.muted{color:var(--ink-soft)}
.small{font-size:12.5px}
.row{display:flex;gap:10px;align-items:center}
.list{display:flex;flex-direction:column;gap:10px}
.chip{border:1.5px solid var(--line);background:var(--paper);border-radius:99px;padding:5px 11px;font-size:13px;font-weight:700;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:11px;font-weight:700;border-radius:99px;padding:2px 8px;white-space:nowrap}
.p-leaf{background:var(--leaf-bg);color:var(--leaf)} .p-berry{background:var(--berry-bg);color:var(--berry)} .p-sky{background:var(--sky-bg);color:var(--sky)} .p-amber{background:var(--amber-bg);color:var(--ink)}
.btn{border:0;border-radius:14px;padding:11px 16px;font-weight:700;background:var(--ink);color:var(--paper)}
.btn.sun{background:var(--sun);color:var(--sun-ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:11px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:11px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:transparent;padding:6px 10px;font-size:12.5px;font-weight:700;color:var(--ink-soft)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg.full{display:flex}.seg.full button{flex:1;padding:8px 6px}
.sq{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none}
/* Hoy */
.hero{background:var(--sun);color:var(--sun-ink);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.hero h2{font-size:24px}
.hero .who{display:flex;align-items:center;gap:10px;font-weight:700}
.hero .who .av{width:38px;height:38px;border-radius:50%;background:var(--paper);color:var(--ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;flex:none}
.hero svg.sunmark{position:absolute;right:-14px;top:-14px;opacity:.35}
.next{display:grid;grid-template-columns:54px 1fr;gap:10px;align-items:start}
.time{font-family:var(--display);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.time small{display:block;font-family:var(--body);font-size:11px;font-weight:400;color:var(--ink-soft)}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.qbtn{border:1.5px solid var(--line);background:var(--paper);border-radius:16px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12.5px;font-weight:700}
.qbtn .ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:15px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13.5px}
.kv dt{color:var(--ink-soft)} .kv dd{margin:0;font-weight:700}
.arr{display:flex;gap:10px;align-items:center;font-size:13.5px}
.arr .pin{width:30px;height:30px;border-radius:50%;background:var(--leaf-bg);display:grid;place-items:center;flex:none}
.summary{white-space:pre-wrap;font-size:14px;background:var(--paper-2);border-radius:12px;padding:10px 12px}
/* Jugar */
.act{display:grid;grid-template-columns:64px 1fr;gap:12px;text-align:left;width:100%;border:1px solid var(--line);background:var(--paper);border-radius:var(--r);padding:12px}
.act .sw{width:64px;height:64px;border-radius:16px;display:grid;place-items:center}
.act h3{font-size:17px}
.act .meta,.meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.miss{font-size:12px;color:var(--berry);margin-top:4px}
.dim{opacity:.55}
.bignum{font-family:var(--display);font-weight:800;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.chore{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.chore:first-of-type{border-top:0}
.prog{height:8px;background:var(--paper-2);border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--leaf);border-radius:9px}
.mile{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.mile:first-of-type{border-top:0}
.mile input{width:20px;height:20px;margin-top:2px;accent-color:var(--leaf);flex:none}
.linkish{border:0;background:none;padding:0;color:var(--sky);font-weight:700;font-size:12.5px;text-align:left}
/* Agenda */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{border:0;background:transparent;border-radius:14px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--ink-soft);font-weight:700}
.day b{font-family:var(--display);font-size:18px;color:var(--ink);font-variant-numeric:tabular-nums}
.day[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.day[aria-pressed="true"] b{color:var(--paper)}
.day .dot{width:5px;height:5px;border-radius:50%;background:var(--sun)}
.ev{display:grid;grid-template-columns:54px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line);text-align:left;width:100%;background:none;border-left:0;border-right:0;border-bottom:0}
.ev:first-of-type{border-top:0}
.ev.ext b{color:var(--ink-soft)}
.conflict{margin-top:6px;background:var(--amber-bg);border-radius:10px;padding:7px 9px;font-size:12.5px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.bar{height:26px;border-radius:8px;background:var(--paper-2);position:relative;overflow:hidden}
.bar span{position:absolute;top:0;bottom:0;border-radius:8px;display:flex;align-items:center;padding-left:8px;font-size:11.5px;font-weight:700;white-space:nowrap;overflow:hidden;color:var(--ink)}
.task{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0}
.task input{width:20px;height:20px;margin-top:2px;accent-color:var(--leaf);flex:none}
.task.done .t{text-decoration:line-through;color:var(--ink-soft)}
.form{display:flex;flex-direction:column;gap:8px}
.form input,.form select,.form textarea{width:100%;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:9px 11px;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.thread{display:flex;flex-direction:column;gap:8px}
.bub{background:var(--paper-2);border-radius:14px;padding:8px 11px;font-size:14px;max-width:90%}
.bub.mine{align-self:flex-end;background:var(--sky-bg)}
.bub b{display:block;font-size:12px}
/* Cocina */
.menu{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.menu div{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 6px;font-size:11.5px;min-width:0}
.menu div.today{border:2px solid var(--ink)}
.menu b{display:block;font-family:var(--display);font-size:13px}
.rec{display:grid;grid-template-columns:72px 1fr;gap:12px;text-align:left;width:100%;border:1px solid var(--line);background:var(--paper);border-radius:var(--r);padding:10px}
.rec .ph{width:72px;height:72px;border-radius:14px;background:var(--amber-bg);display:grid;place-items:center;overflow:hidden;font-family:var(--display);font-weight:800;font-size:26px;color:var(--ink)}
.rec .ph img{width:100%;height:100%;object-fit:cover}
.aisle{display:flex;flex-direction:column}
.shop{display:flex;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.shop:first-of-type{border-top:0}
.shop input{width:20px;height:20px;accent-color:var(--leaf);flex:none}
.shop.done span{text-decoration:line-through;color:var(--ink-soft)}
/* Familia */
.feed .item{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.feed .item:first-child{border-top:0}
.av2{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:13px;background:var(--paper-2);border:1px solid var(--line);flex:none}
.item.urg{background:var(--berry-bg);margin:0 -14px;padding:10px 14px;border-radius:12px;border-top:0}
.emerg{border:2px solid var(--berry);background:var(--berry-bg);border-radius:var(--r);padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.emerg h3{grid-column:1/-1;color:var(--berry);font-size:17px}
.emerg div{font-size:13px;min-width:0} .emerg b{display:block;font-size:14px}
.perm{width:100%;border-collapse:collapse;font-size:12.5px}
.perm th,.perm td{text-align:left;padding:6px 4px;border-top:1px solid var(--line);vertical-align:top}
.perm th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft)}
.yes{color:var(--leaf);font-weight:700}.no{color:var(--ink-soft)}
/* Casa */
.cam{border-radius:14px;overflow:hidden;background:var(--night);position:relative}
.cam svg{display:block;width:100%;height:auto}
.live{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;display:flex;gap:6px;align-items:center}
.live i{width:7px;height:7px;border-radius:50%;background:#FF4D6D;display:inline-block}
@media (prefers-reduced-motion:no-preference){.live i{animation:blink 1.2s infinite}@keyframes blink{50%{opacity:.2}}}
.stamp{position:absolute;right:10px;bottom:8px;color:#fff;font-size:11px;font-variant-numeric:tabular-nums;opacity:.85}
.doc{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.doc:first-of-type{border-top:0}
.doc .ico{width:36px;height:44px;border-radius:6px;background:var(--paper-2);border:1.5px solid var(--line);display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--ink-soft)}
.switch{position:relative;width:42px;height:24px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:background .15s}
.switch span::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:var(--paper);top:3px;left:3px;transition:transform .15s}
.switch input:checked+span{background:var(--leaf)}
.switch input:checked+span::after{transform:translateX(18px)}
.switch input:focus-visible+span{outline:3px solid var(--sky);outline-offset:2px}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.setrow:first-of-type{border-top:0}
.money{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.cust{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:11px}
.cust div{border-radius:10px;padding:6px 0;font-weight:700}
/* Nav */
nav{display:grid;background:var(--paper);border-top:1px solid var(--line);padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:700;color:var(--ink-soft);padding:6px 0;border-radius:12px;min-width:0}
nav button svg{width:22px;height:22px}
nav button[aria-current="page"]{color:var(--ink);background:var(--paper-2)}
.fab{position:absolute;right:16px;bottom:80px;border:0;background:var(--ink);color:var(--paper);border-radius:99px;padding:12px 16px;font-weight:700;display:flex;gap:8px;align-items:center;box-shadow:0 6px 18px rgba(20,30,60,.25);z-index:5}
.fab i{width:10px;height:10px;border-radius:50%;background:var(--sun);display:inline-block}
/* Sheets */
.sheet-wrap{position:absolute;inset:0;background:rgba(14,20,38,.45);display:flex;align-items:flex-end;z-index:10}
.sheet{background:var(--paper);width:100%;max-height:90%;overflow-y:auto;border-radius:26px 26px 0 0;padding:18px 18px 24px;display:flex;flex-direction:column;gap:12px}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto}
.sheet ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.x{border:0;background:var(--paper-2);border-radius:50%;width:32px;height:32px;font-size:18px;line-height:1;flex:none}
/* Timer y pizarra */
.timer,.board{position:absolute;inset:0;z-index:20}
.timer{background:var(--ink);color:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
.timer p{max-width:28ch;color:var(--paper);opacity:.8;margin:0}
.ring{width:200px;height:200px}
.board{background:var(--paper);overflow-y:auto;padding:22px 20px;display:flex;flex-direction:column;gap:14px}
.board h1{font-size:34px}
.board .blk{border-top:3px solid var(--ink);padding-top:8px;display:flex;flex-direction:column;gap:4px}
.board .blk div{font-size:17px}
/* Chat */
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 13px;border-radius:16px;white-space:pre-wrap;font-size:14.5px}
.msg.me{align-self:flex-end;background:var(--ink);color:var(--paper);border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--paper);border:1px solid var(--line);border-bottom-left-radius:4px}
.composer{display:flex;gap:8px;position:sticky;bottom:0;background:var(--paper);padding-top:8px}
.composer input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--paper-2)}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:var(--leaf);color:var(--paper);padding:8px 14px;border-radius:99px;font-weight:700;font-size:13px;z-index:30;max-width:90%;text-align:center}
/* Ver cómo se juega */
.stage{background:var(--paper-2);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.stage svg{display:block;width:100%;height:auto}
.steps-dots{display:flex;gap:6px;justify-content:center}
.steps-dots button{width:26px;height:6px;border-radius:9px;border:0;background:var(--line);padding:0}
.steps-dots button[aria-current="step"]{background:var(--ink)}
.cap{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;min-height:52px}
.cap .n{width:30px;height:30px;border-radius:50%;background:var(--sun);color:var(--sun-ink);display:grid;place-items:center;font-family:var(--display);font-weight:800}
.cap b{font-family:var(--display);font-size:17px;display:block;line-height:1.15}
.anim-btn{display:flex;align-items:center;justify-content:center;gap:8px}
.s *{transform-box:fill-box}
.pop{transform-origin:50% 100%;animation:pop .45s cubic-bezier(.3,1.6,.6,1) both}
@keyframes pop{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.3s ease-out both}
@keyframes draw{to{stroke-dashoffset:0}}
.fadein{animation:fadein .5s both}@keyframes fadein{from{opacity:0}}
.fadeout{animation:fadeout .5s 1s both}@keyframes fadeout{to{opacity:0;transform:scale(.6)}}
.roll{transform-origin:50% 50%;animation:roll 2.6s ease-in infinite}
@keyframes roll{0%{transform:translateX(0) rotate(0)}48%{transform:translateX(150px) rotate(540deg)}100%{transform:translateX(150px) rotate(540deg);opacity:0}}
.knock{transform-origin:50% 50%;animation:knock 2.6s ease-out infinite}
@keyframes knock{0%,46%{transform:none}70%,100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r))}}
.walk{animation:walk 4s linear infinite}
@keyframes walk{0%{transform:translate(30px,120px)}25%{transform:translate(90px,80px)}50%{transform:translate(150px,120px)}75%{transform:translate(210px,80px)}100%{transform:translate(270px,120px)}}
.hopx{animation:hopx 3s linear infinite}@keyframes hopx{from{transform:translateX(30px)}to{transform:translateX(280px)}}
.hopy{animation:hopy .6s ease-in-out infinite alternate}@keyframes hopy{from{transform:translateY(0)}to{transform:translateY(-22px)}}
.drop{animation:drop .9s cubic-bezier(.3,1.3,.6,1) .2s both}@keyframes drop{from{transform:translateY(-90px);opacity:0}}
.slidel{animation:slidel .7s ease-out both}@keyframes slidel{from{transform:translateX(-60px);opacity:0}}
.slider{animation:slider .7s ease-out both}@keyframes slider{from{transform:translateX(60px);opacity:0}}
.twinkle{transform-origin:50% 50%;animation:tw 1.4s ease-in-out infinite alternate}@keyframes tw{from{opacity:.2;transform:scale(.6)}}
.tick{animation:pop .3s both}
@media (prefers-reduced-motion:reduce){.s *{animation-duration:.01s!important;animation-iteration-count:1!important}}

 if(sample){try{const r=await sample(`Eres Tribbu. Resume para los papás, en español mexicano y en máximo 90 palabras, cómo fue el día de sus hijos según esta bitácora. Primero lo importante o pendiente de atender, luego lo demás. Sin dar diagnósticos.\n\n${lines}`);out=r.text}catch(e){out=""}}

function demoSheet(a){
 const steps=DEMOS[a.id];let i=0,auto=true,iv;
 sheet(`<div class="sheet-h"><div><span class="label">Ver cómo se juega</span><h2 style="font-size:22px">${esc(a.t)}</h2></div><button class="x" data-close aria-label="Cerrar">×</button></div>
  <div class="stage"><svg class="s" id="stg" viewBox="0 0 320 200" role="img"></svg></div>
  <div class="cap"><span class="n" id="cn"></span><div><b id="ch"></b><span class="muted" id="cp"></span></div></div>
  <div class="steps-dots" id="dots">${steps.map((_,k)=>`<button data-k="${k}" aria-label="Paso ${k+1}"></button>`).join("")}</div>
  <div class="row"><button class="btn ghost" id="prev">Anterior</button><button class="btn" id="next" style="flex:1">Siguiente</button></div>`,w=>{
  const show=()=>{const s=steps[i];const g=w.querySelector("#stg");g.innerHTML=s.svg();g.setAttribute("aria-label",s.h);
   w.querySelector("#cn").textContent=i+1;w.querySelector("#ch").textContent=s.h;w.querySelector("#cp").textContent=s.p;
   w.querySelectorAll("#dots button").forEach((b,k)=>{if(k===i)b.setAttribute("aria-current","step");else b.removeAttribute("aria-current")});
   w.querySelector("#prev").disabled=i===0;const nx=w.querySelector("#next");
   nx.className=i===steps.length-1?"btn sun":"btn";nx.textContent=i===steps.length-1?"Empezar y guardar el teléfono":"Siguiente"};
  const stop=()=>{auto=false;clearInterval(iv)};
  iv=setInterval(()=>{if(!w.isConnected){clearInterval(iv);return}if(auto&&i<steps.length-1){i++;show()}else clearInterval(iv)},4200);
  w.querySelector("#prev").onclick=()=>{stop();if(i>0){i--;show()}};
  w.querySelector("#next").onclick=()=>{stop();if(i<steps.length-1){i++;show()}else{w.remove();timer(a)}};
  w.querySelectorAll("#dots button").forEach(b=>b.onclick=()=>{stop();i=+b.dataset.k;show()});
  show();
 });
}
let tmr=null;
function timer(a){
 let left=a.min*60;const total=left;const d=document.createElement("div");d.className="timer";
 d.innerHTML=`<span class="label" style="color:var(--sun)">Modo sin pantalla</span><h2 style="font-size:26px">${esc(a.t)}</h2>
 <svg class="ring" viewBox="0 0 200 200"><circle cx="100" cy="100" r="88" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="12"/><circle id="arc" cx="100" cy="100" r="88" fill="none" stroke="var(--sun)" stroke-width="12" stroke-linecap="round" stroke-dasharray="553" stroke-dashoffset="0" transform="rotate(-90 100 100)"/><text id="tt" x="100" y="114" text-anchor="middle" fill="currentColor" style="font:800 46px var(--display)"></text></svg>
 <p>Deja el teléfono boca abajo. Te avisamos cuando termine el tiempo.</p><button class="btn ghost" style="color:var(--paper);border-color:rgba(255,255,255,.3)" id="stop">Terminar</button>`;
 $("#app").appendChild(d);
 const draw=()=>{d.querySelector("#tt").textContent=Math.floor(left/60)+":"+String(left%60).padStart(2,"0");d.querySelector("#arc").setAttribute("stroke-dashoffset",553*(1-left/total))};
 draw();clearInterval(tmr);tmr=setInterval(()=>{left--;draw();if(left<=0){clearInterval(tmr);d.remove();doneAct(a)}},1000);
 d.querySelector("#stop").onclick=()=>{clearInterval(tmr);d.remove();doneAct(a)};
}

   let ans="";const sample=await getSample();
   if(sample){try{const turns=hist.slice(-8).map((m,i)=>({role:m.role,content:i===0?context()+"\n\nPregunta: "+m.content:m.content}));
     const r=await sample(turns,{cache:false,onText:({text})=>{p.textContent=text;p.scrollIntoView({block:"end"})}});ans=r.text}
    catch(e){ans=e&&e.code==="rate_limited"?"Hay muchas preguntas seguidas. Intenta de nuevo en un momento.":fallback(q)}}
   else ans=fallback(q);
   p.textContent=ans;hist.push({role:"assistant",content:ans});p.scrollIntoView({block:"end"});
  };
  w.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>ask(b.dataset.q));
  w.querySelector("#cf").onsubmit=e=>{e.preventDefault();const q=w.querySelector("#cq").value.trim();if(!q)return;w.querySelector("#cq").value="";ask(q)};
  if(pre)ask(pre);
 });
}
$("#fab").onclick=()=>openChat();

shell();render();
})();
</script>
